<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Мій словник · данська → українська</title>
<style>
  :root {
    --bg: #F4F5F7; --surface: #FFFFFF; --ink: #1C2230; --muted: #6B7280;
    --line: #E6E8EC; --accent: #4B5BD6; --accent-soft: #EEF0FB;
    --success: #2E7D5B; --again: #B5532A;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: var(--sans); color: var(--ink); max-width: 560px; margin: 0 auto; padding: 16px; min-height: 100vh; }
  h1 { font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: -0.3px; margin: 0; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .tabs { display: flex; gap: 6px; margin: 14px 0 16px; }
  .tab { flex: 1; font: 600 14px var(--sans); padding: 9px 4px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .tab.active { border-color: var(--accent); background: var(--accent); color: #fff; }
  .badge { margin-left: 6px; font-size: 12px; background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 7px; }
  .tab.active .badge { background: #fff; color: var(--accent); }
  input { width: 100%; font-family: var(--serif); font-size: 17px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); outline: none; }
  input:focus { border-color: var(--accent); }
  label { font: 600 13px var(--sans); color: var(--muted); display: block; margin: 12px 0 6px 2px; }
  .btn { width: 100%; font: 600 16px var(--sans); border-radius: 12px; padding: 13px 18px; border: 1px solid transparent; cursor: pointer; transition: opacity .15s; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.soft { background: var(--accent-soft); color: var(--accent); }
  .btn.success { background: var(--success); color: #fff; }
  .btn.again { background: #fff; color: var(--again); border: 1px solid var(--again); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .word-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .word-da { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .word-uk { font-size: 14px; color: var(--muted); }
  .del { border: none; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 6px; }
  .spk { border: none; background: none; color: var(--accent); font-size: 18px; cursor: pointer; padding: 6px; line-height: 1; }
  .word-actions { display: flex; align-items: center; gap: 0; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .hint { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font: 500 14px var(--serif); background: var(--accent-soft); color: var(--accent); border: none; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .flash { min-height: 170px; display: flex; flex-direction: column; justify-content: center; text-align: center; margin-bottom: 16px; }
  .flash .front { font-family: var(--serif); font-size: 30px; font-weight: 700; }
  .flash .back { font-size: 20px; font-weight: 600; margin-top: 6px; }
  .toggle { display: inline-flex; gap: 6px; margin-top: 16px; }
  .toggle button { font: 600 13px var(--sans); padding: 6px 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
  .toggle button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .dir-toggle { display: flex; gap: 6px; }
  .dir-toggle button { flex: 1; font: 600 13px var(--sans); padding: 9px 6px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
  .dir-toggle button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .spacer { height: 12px; }
</style>
</head>
<body>
  <div>
    <h1>Мій словник</h1>
    <div class="sub" id="sub">данська → українська</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-dict" onclick="setTab('dict')">Словник</button>
    <button class="tab" id="tab-train" onclick="setTab('train')">Картки <span class="badge" id="dueBadge" style="display:none"></span></button>
  </div>

  <!-- СЛОВНИК -->
  <div id="view-dict">
    <div class="dir-toggle">
      <button class="on" id="dir-da" onclick="setInputDir('da2uk')">Данська → Українська</button>
      <button id="dir-uk" onclick="setInputDir('uk2da')">Українська → Данська</button>
    </div>
    <label for="daInput" id="labelSource" style="margin-top:14px">Данське слово</label>
    <input id="daInput" placeholder="напр. hyggelig" autocomplete="off" autocapitalize="none" onkeydown="if(event.key==='Enter')doTranslate()" />
    <div class="spacer"></div>
    <button class="btn primary" id="translateBtn" onclick="doTranslate()">Перекласти</button>

    <div id="result" style="display:none; margin-top:14px;">
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span id="resultDa" class="word-da"></span>
          <button class="spk" onclick="speakResultDanish()" title="Прослухати данською">🔊</button>
        </div>
        <label for="ukInput" id="labelTarget">Переклад українською</label>
        <input id="ukInput" placeholder="переклад" />
        <div id="variantChips" class="chips"></div>
        <div class="spacer"></div>
        <button class="btn success" onclick="saveWord()">Зберегти у словник</button>
      </div>
    </div>

    <div class="spacer"></div>
    <div id="dictHeader" class="muted" style="font-size:13px; margin:18px 2px 8px; display:none;"></div>
    <div id="dictList"></div>
    <div id="exportWrap" style="display:none; margin-top:8px;">
      <button class="btn soft" onclick="exportCsv()">Скопіювати як CSV (для Anki)</button>
    </div>
  </div>

  <!-- КАРТКИ -->
  <div id="view-train" style="display:none;">
    <div id="trainMenu" class="center" style="padding:20px 8px;"></div>
    <div id="trainCard" style="display:none;">
      <div class="muted center" id="trainProgress" style="font-size:13px; margin-bottom:12px;"></div>
      <div class="card flash" id="flashBox"></div>
      <div id="trainControls"></div>
    </div>
  </div>

<script>
  // ── Сховище (localStorage; відкат у памʼять) ───────────────────
  var KEY = "slovnyk_v1";
  var memFallback = null;
  function load() {
    try { var r = localStorage.getItem(KEY); return r ? JSON.parse(r) : []; }
    catch (e) { return memFallback ? JSON.parse(memFallback) : []; }
  }
  function save(deck) {
    var s = JSON.stringify(deck);
    try { localStorage.setItem(KEY, s); } catch (e) { memFallback = s; }
  }

  var DAY = 86400000;
  var INTERVAL = [0, 1, 3, 7, 16, 35];
  var deck = load();
  var tab = "dict";
  var dir = "da2uk";
  var inputDir = "da2uk";
  var lastTranslated = "";
  var queue = null, revealed = false;

  function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function escAttr(s) { return esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

  // ── Озвучення данською (Web Speech API) ────────────────────────
  var daVoice = null;
  function pickVoice() {
    try {
      var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
      daVoice = vs.find(function (v) { return /^da([-_]|$)/i.test(v.lang); }) || null;
    } catch (e) {}
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text) {
    if (!text || !window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "da-DK"; if (daVoice) u.voice = daVoice; u.rate = 0.9;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function speakWord(id) { var c = deck.find(function (x) { return x.id === id; }); if (c) speak(c.da); }
  function speakCurrent() { if (queue && queue.length) { var c = deck.find(function (x) { return x.id === queue[0]; }); if (c) speak(c.da); } }
  function speakResultDanish() {
    if (inputDir === "da2uk") speak(lastTranslated);
    else speak(document.getElementById("ukInput").value);
  }

  // ── Напрямок перекладу ─────────────────────────────────────────
  function setInputDir(d) {
    inputDir = d;
    document.getElementById("dir-da").className = d === "da2uk" ? "on" : "";
    document.getElementById("dir-uk").className = d === "uk2da" ? "on" : "";
    var inp = document.getElementById("daInput");
    if (d === "da2uk") {
      document.getElementById("labelSource").textContent = "Данське слово";
      document.getElementById("labelTarget").textContent = "Переклад українською";
      inp.placeholder = "напр. hyggelig";
    } else {
      document.getElementById("labelSource").textContent = "Українське слово";
      document.getElementById("labelTarget").textContent = "Переклад данською";
      inp.placeholder = "напр. затишний";
    }
    document.getElementById("result").style.display = "none";
    inp.value = "";
    document.getElementById("ukInput").value = "";
    document.getElementById("variantChips").innerHTML = "";
  }

  // ── Кілька варіантів перекладу (з MyMemory) ────────────────────
  function extractVariants(data, word, primary) {
    var out = [], seen = {}, w = (word || "").toLowerCase();
    function add(s) {
      s = (s || "").trim(); var k = s.toLowerCase();
      if (!s || seen[k]) return;
      if (/MYMEMORY|INVALID|PLEASE SELECT/i.test(s)) return;
      seen[k] = 1; out.push(s);
    }
    if (primary) primary.split(/\s*[,;/]\s*/).forEach(add);
    var matches = (data && data.matches) ? data.matches : [];
    for (var i = 0; i < matches.length; i++) {
      var seg = (matches[i].segment || "").trim().toLowerCase();
      var tr = (matches[i].translation || "").trim();
      if (seg === w && tr) tr.split(/\s*[,;/]\s*/).forEach(add);
    }
    return out.slice(0, 6);
  }

  // ── Синоніми з двомовного словника Google (без ключа) ──────────
  async function fetchGoogleDict(word, sl, tl) {
    var url = "https://translate.googleapis.com/translate_a/single?client=gtx&dj=1&sl=" + sl + "&tl=" + tl + "&dt=t&dt=bd&q=" + encodeURIComponent(word);
    var r = await fetch(url);
    var d = await r.json();
    var primary = "";
    if (d && d.sentences) d.sentences.forEach(function (s) { if (s.trans) primary += s.trans; });
    var syns = [];
    if (d && d.dict) d.dict.forEach(function (b) { (b.terms || []).forEach(function (t) { syns.push(t); }); });
    return { primary: primary.trim(), syns: syns };
  }

  function dedupeVariants(arr) {
    var out = [], seen = {};
    arr.forEach(function (s) {
      s = (s || "").trim(); var k = s.toLowerCase();
      if (!s || seen[k]) return;
      if (/MYMEMORY|INVALID|PLEASE SELECT/i.test(s)) return;
      seen[k] = 1; out.push(s);
    });
    return out.slice(0, 10);
  }

  // ── Переклад ───────────────────────────────────────────────────
  async function doTranslate() {
    var da = document.getElementById("daInput").value.trim();
    if (!da) return;
    var btn = document.getElementById("translateBtn");
    btn.disabled = true; btn.textContent = "Перекладаю…";
    lastTranslated = da;
    var variants = [];
    try {
      var sl = inputDir === "da2uk" ? "da" : "uk";
      var tl = inputDir === "da2uk" ? "uk" : "da";
      var mmUrl = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(da) + "&langpair=" + sl + "|" + tl;
      var results = await Promise.all([
        fetchGoogleDict(da, sl, tl).catch(function () { return null; }),
        fetch(mmUrl).then(function (r) { return r.json(); }).catch(function () { return null; })
      ]);
      var g = results[0], mm = results[1];
      var all = [];
      if (g) { if (g.primary) all.push(g.primary); g.syns.forEach(function (s) { all.push(s); }); }
      if (mm) {
        var t = mm.responseData ? (mm.responseData.translatedText || "") : "";
        extractVariants(mm, da, t).forEach(function (v) { all.push(v); });
      }
      variants = dedupeVariants(all);
    } catch (e) {}
    btn.disabled = false; btn.textContent = "Перекласти";

    document.getElementById("resultDa").textContent = da;
    document.getElementById("ukInput").value = variants[0] || "";
    if (!variants.length) document.getElementById("ukInput").placeholder = "Не знайдено — впиши вручну";

    var chips = document.getElementById("variantChips");
    var extra = variants.slice(1);
    chips.innerHTML = extra.length
      ? '<span class="muted" style="font-size:12px; width:100%; margin-bottom:2px;">ще варіанти (тапни, щоб додати):</span>' +
        extra.map(function (v) { return '<button class="chip" onclick="insertVariant(this.getAttribute(\'data-v\'))" data-v="' + escAttr(v) + '">' + esc(v) + '</button>'; }).join("")
      : "";

    document.getElementById("result").style.display = "block";
  }

  function insertVariant(v) {
    var el = document.getElementById("ukInput");
    var parts = el.value.trim() ? el.value.split(/\s*,\s*/) : [];
    if (parts.map(function (p) { return p.toLowerCase(); }).indexOf(v.toLowerCase()) === -1) {
      parts.push(v); el.value = parts.join(", ");
    }
  }

  function saveWord() {
    var src = (lastTranslated || document.getElementById("daInput").value).trim();
    var tgt = document.getElementById("ukInput").value.trim();
    if (!src || !tgt) return;
    var da = inputDir === "da2uk" ? src : tgt;
    var uk = inputDir === "da2uk" ? tgt : src;
    if (!da || !uk) return;
    var exists = deck.find(function (c) { return c.da.toLowerCase() === da.toLowerCase(); });
    if (exists) { exists.uk = uk; }
    else {
      deck.unshift({
        id: Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        da: da, uk: uk, box: 1, due: Date.now(), created: Date.now()
      });
    }
    save(deck);
    document.getElementById("daInput").value = "";
    document.getElementById("ukInput").value = "";
    document.getElementById("variantChips").innerHTML = "";
    document.getElementById("result").style.display = "none";
    lastTranslated = "";
    document.getElementById("daInput").focus();
    render();
  }

  function deleteWord(id) { deck = deck.filter(function (c) { return c.id !== id; }); save(deck); render(); }

  function exportCsv() {
    var csv = deck.map(function (c) { return '"' + c.da + '","' + (c.uk || "").replace(/"/g, "'") + '"'; }).join("\n");
    try { navigator.clipboard.writeText(csv); alert("Скопійовано " + deck.length + " слів."); }
    catch (e) { prompt("Скопіюй вручну:", csv); }
  }

  function dueCount() { var now = Date.now(); return deck.filter(function (c) { return c.due <= now; }).length; }

  // ── Тренування ─────────────────────────────────────────────────
  function startSession(all) {
    var now = Date.now();
    var pool = all ? deck.slice() : deck.filter(function (c) { return c.due <= now; });
    var ids = pool.map(function (c) { return c.id; });
    for (var i = ids.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = ids[i]; ids[i] = ids[j]; ids[j] = t; }
    queue = ids; revealed = false; render();
  }
  function grade(known) {
    if (!queue || !queue.length) return;
    var id = queue[0];
    var c = deck.find(function (x) { return x.id === id; });
    if (c) { c.box = known ? Math.min(c.box + 1, 5) : 1; c.due = known ? Date.now() + INTERVAL[c.box] * DAY : Date.now(); }
    save(deck);
    var rest = queue.slice(1); if (!known) rest.push(id);
    queue = rest; revealed = false; render();
  }

  function setTab(t) { tab = t; if (t === "train") queue = null; render(); }

  // ── Рендер ─────────────────────────────────────────────────────
  function render() {
    document.getElementById("tab-dict").className = "tab" + (tab === "dict" ? " active" : "");
    document.getElementById("tab-train").className = "tab" + (tab === "train" ? " active" : "");
    document.getElementById("view-dict").style.display = tab === "dict" ? "block" : "none";
    document.getElementById("view-train").style.display = tab === "train" ? "block" : "none";
    document.getElementById("sub").textContent = deck.length + " слів · до повторення: " + dueCount();

    var badge = document.getElementById("dueBadge"), dc = dueCount();
    if (dc > 0) { badge.style.display = "inline-block"; badge.textContent = dc; } else badge.style.display = "none";

    var list = document.getElementById("dictList");
    var header = document.getElementById("dictHeader");
    var exportWrap = document.getElementById("exportWrap");
    if (deck.length === 0) {
      list.innerHTML = '<div class="muted center" style="padding:20px; font-size:14px;">Словник порожній. Додай перше слово вище.</div>';
      header.style.display = "none"; exportWrap.style.display = "none";
    } else {
      header.style.display = "block"; header.textContent = "Збережені слова";
      exportWrap.style.display = "block";
      list.innerHTML = deck.map(function (c) {
        return '<div class="word-item"><div><div class="word-da">' + esc(c.da) + '</div>' +
          '<div class="word-uk">' + esc(c.uk) + '</div></div>' +
          '<div class="word-actions">' +
          '<button class="spk" onclick="speakWord(\'' + c.id + '\')" title="Прослухати">🔊</button>' +
          '<button class="del" onclick="deleteWord(\'' + c.id + '\')" title="Видалити">🗑</button></div></div>';
      }).join("");
    }

    var menu = document.getElementById("trainMenu");
    var cardWrap = document.getElementById("trainCard");
    if (queue === null) {
      cardWrap.style.display = "none"; menu.style.display = "block";
      if (deck.length === 0) {
        menu.innerHTML = '<div class="muted" style="font-size:15px;">Спершу додай кілька слів у словник.</div>';
      } else {
        menu.innerHTML =
          '<div class="muted" style="font-size:15px; margin-bottom:16px;">До повторення: <b style="color:var(--ink)">' + dueCount() + '</b> зі ' + deck.length + '</div>' +
          '<button class="btn primary" ' + (dueCount() === 0 ? "disabled" : "") + ' onclick="startSession(false)">Почати повторення</button>' +
          '<div class="spacer"></div>' +
          '<button class="btn soft" onclick="startSession(true)">Тренувати всі (' + deck.length + ')</button>' +
          '<div class="toggle">' +
            '<button class="' + (dir === "da2uk" ? "on" : "") + '" onclick="dir=\'da2uk\';render()">Слово → переклад</button>' +
            '<button class="' + (dir === "uk2da" ? "on" : "") + '" onclick="dir=\'uk2da\';render()">Переклад → слово</button>' +
          '</div>';
      }
    } else if (queue.length === 0) {
      menu.style.display = "block"; cardWrap.style.display = "none";
      menu.innerHTML = '<div style="font-family:var(--serif); font-size:20px; margin-bottom:8px;">Готово 🎉</div>' +
        '<div class="muted" style="font-size:14px; margin-bottom:18px;">Сесію завершено. Слова спливуть за розкладом.</div>' +
        '<button class="btn soft" onclick="queue=null;render()">До меню</button>';
    } else {
      menu.style.display = "none"; cardWrap.style.display = "block";
      var c = deck.find(function (x) { return x.id === queue[0]; });
      document.getElementById("trainProgress").textContent = "Залишилось у сесії: " + queue.length;
      var front = dir === "da2uk" ? c.da : c.uk;
      var back = dir === "da2uk" ? c.uk : c.da;
      var box = document.getElementById("flashBox");
      box.innerHTML = '<div class="front">' + esc(front) + '</div>' +
        (revealed ? '<div class="back">' + esc(back) + '</div>' : '') +
        '<div style="margin-top:12px;"><button class="spk" onclick="speakCurrent()" title="Прослухати данською">🔊</button></div>';
      var ctrl = document.getElementById("trainControls");
      ctrl.innerHTML = revealed
        ? '<div class="row"><button class="btn again" onclick="grade(false)">Ще раз</button><button class="btn success" onclick="grade(true)">Знаю</button></div>'
        : '<button class="btn primary" onclick="revealed=true;render()">Показати відповідь</button>';
    }
  }

  render();
</script>
</body>
</html>
